name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# A second run cannot mutate a draft while the first run is publishing it.
concurrency:
  group: mirrorbird-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate release tag and config
        run: node --input-type=module -e "import {loadConfig,checkTag} from './tools/release.mjs'; checkTag(loadConfig(process.cwd()), process.env.GITHUB_REF_NAME);"
      - name: Build, test and vet
        run: node tools/build.mjs --check
      - name: Test tools
        run: node --test tools/*.test.mjs
      - name: Package, verify both architectures and publish
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/release.mjs --publish
